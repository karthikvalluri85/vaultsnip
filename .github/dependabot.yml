version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    ignore:
      # Vendored into web/lib and upgraded by hand, because a new OCR engine or chart
      # library must be re-tested against the masking and replica checks first.
      - dependency-name: "tesseract.js"
      - dependency-name: "@tesseract.js-data/*"
      - dependency-name: "echarts"
