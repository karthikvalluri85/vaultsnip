name: Accuracy (nightly)

# The full masking benchmark, too slow for every pull request: 60 generated dashboards.
# (The layout-builder benchmarks were retired with the chart-rebuilding replica.) Each fails if a figure drops below its committed baseline (tools/bench-gate.mjs).
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  masking:
    name: Masking (60 generated dashboards)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node tools/synth-bench/gen.mjs --count 60
      - run: node tools/synth-bench/run.mjs --json synth-full.json
      - run: node tools/bench-gate.mjs synth-full.json tools/synth-bench/baseline.json
      - if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: accuracy-masking
          path: synth-*.json
          retention-days: 30

