name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - run: node tools/check.mjs

  e2e:
    name: End-to-end (Chromium)
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e

  scanner:
    name: Rust/WASM scanner
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: rustup target add wasm32-unknown-unknown
      - run: cargo install wasm-pack --locked
      - run: npm ci
      - run: npm run test:rust
      - run: npm run build:wasm
      - run: npm run test:unit

  ml:
    name: On-device name check
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run fetch:model -- --check
      - run: npx tsc -p .
      - name: Committed web/ml matches src/
        run: npm run build:ml && git diff --exit-code -- web/ml web/lib/vs-context.js
      - run: npm run test:unit
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ml-e2e

  canvas:
    name: Canvas redaction (extension)
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: rustup target add wasm32-unknown-unknown
      - run: cargo install wasm-pack --locked
      - run: npm ci
      - run: npm run build:wasm
      - name: Committed extension scripts match src/
        run: npm run build:ext && git diff --exit-code -- extension/*.js extension/*.html
      - run: npx playwright install --with-deps chromium
      - run: npm run test:canvas-e2e

  build:
    name: Build packages
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v7
      - run: bash build.sh --model-url https://vaultsnip.pages.dev/lang
      - uses: actions/upload-artifact@v6
        with:
          name: vaultsnip-packages
          path: dist/*.zip
          retention-days: 14
