name: Bug report
description: Something is broken, shows an error or does not respond.
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this.
        **Never attach a real screenshot, client names, figures or API keys.** If sensitive text was left unmasked, do not use this form: [report it privately](https://github.com/karthikvalluri85/vaultsnip/security/advisories/new) instead.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
      placeholder: I clicked Export HTML on the replica screen and nothing downloaded.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Ideally with a bundled sample or a public/fictional screenshot, so the problem can be reproduced.
      placeholder: |
        1. Open the Web analytics sample
        2. Click a country on the map
        3. ...
  - type: input
    id: version
    attributes:
      label: VaultSnip version
      placeholder: "0.2.0"
    validations:
      required: true
  - type: dropdown
    id: channel
    attributes:
      label: Where were you using it?
      options:
        - Web app
        - Chrome extension
        - Edge extension
        - Hugging Face Space
        - Local copy
        - Exported replica file
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and operating system
      placeholder: Chrome 141 on Windows
  - type: input
    id: step
    attributes:
      label: Screen or step
      placeholder: Review and masking
  - type: input
    id: visuals
    attributes:
      label: Visual types involved (if any)
      placeholder: map, column, table
  - type: textarea
    id: error
    attributes:
      label: Error message
      description: Filled in automatically when you use the in-app Feedback button. Please remove anything sensitive.
      render: text
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: This report contains no client data, real figures, personal data or API keys.
          required: true
