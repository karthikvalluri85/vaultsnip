name: Replica looks wrong
description: The replica does not match the original (a chart changed, text left behind, replacement text in the wrong place, size or colour).
title: "[Replica] "
labels: ["replica"]
body:
  - type: markdown
    attributes:
      value: |
        Replica issues are easiest to fix with a **fictional or public** example. Please do not upload a real dashboard, even masked.
  - type: textarea
    id: what
    attributes:
      label: What looks wrong?
      placeholder: A value label on a bar was replaced, but a faint copy of the old number shows behind the new one.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
  - type: input
    id: visuals
    attributes:
      label: Where in the picture
      placeholder: axis labels of a bar chart, KPI tile, table column
  - type: input
    id: version
    attributes:
      label: VaultSnip version
      placeholder: "0.2.0"
    validations:
      required: true
  - type: input
    id: channel
    attributes:
      label: Where were you using it?
      description: Web app, Chrome extension, Edge extension, Hugging Face Space or local copy
      placeholder: Web app
  - type: input
    id: browser
    attributes:
      label: Browser and operating system
  - type: input
    id: step
    attributes:
      label: Screen or step
  - type: textarea
    id: error
    attributes:
      label: Error message (if any)
      render: text
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: Any image I attach is fictional or public, and this report contains no client data.
          required: true
