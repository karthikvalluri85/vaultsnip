<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VaultSnip: client-safe replicas of any dashboard</title>
<meta name="description" content="Mask sensitive text in a dashboard screenshot on your device, then build a watermarked, interactive replica on synthetic data. Nothing is stored.">
<style>
  html, body { margin: 0; height: 100%; background: #f4f5f7; font-family: system-ui, "Segoe UI", sans-serif; }
  iframe { display: block; width: 100%; height: 100%; border: 0; }
  .fallback { position: fixed; right: 12px; bottom: 10px; font-size: 12px; color: #5a6370; background: #fff; border: 1px solid #dde1e7; border-radius: 999px; padding: 6px 12px; }
  .fallback a { color: #0d6b5d; }
</style>
</head>
<body>
<!-- This Space shows the live VaultSnip web app, so it is always the latest release.
     Everything still runs in your browser: masking happens on your device and nothing is stored. -->
<iframe src="https://vaultsnip.pages.dev/?ref=hf" title="VaultSnip"
        allow="clipboard-read; clipboard-write; fullscreen"></iframe>
<div class="fallback">Not loading? <a href="https://vaultsnip.pages.dev/?ref=hf" target="_blank" rel="noopener">Open VaultSnip in a new tab ↗</a></div>
</body>
</html>
