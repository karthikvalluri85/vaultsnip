<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VaultSnip Benchmark Labeller</title>
<!-- Labels a dashboard image for tools/layout-bench/truth.json (developer tool). Open this file in a browser, load an
     image from your computer, draw a box around each visual and give it a type and title, then copy the entry.
     Everything stays in this page: nothing is uploaded. -->
<style>
:root { --bg: #f4f6f8; --surface: #fff; --fg: #18202a; --muted: #5b6776; --line: #d6dde5; --accent: #0f6e8c; --ignore: #b4531f; }
@media (prefers-color-scheme: dark) { :root { --bg: #10151a; --surface: #172028; --fg: #e5ebf0; --muted: #9aa7b4; --line: #2b3640; --accent: #4fb6d6; --ignore: #f0a070; color-scheme: dark } }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.45 "Segoe UI", system-ui, sans-serif; }
header { padding: 14px 18px; border-bottom: 1px solid var(--line); background: var(--surface); display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; }
h1 { font-size: 17px; margin: 0; }
main { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 14px; padding: 14px 18px; }
@media (max-width: 1000px) { main { grid-template-columns: minmax(0, 1fr); } }
.stage { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; overflow: auto; max-height: calc(100vh - 110px); position: relative; }
.stage canvas { display: block; cursor: crosshair; }
.side { display: grid; gap: 12px; align-content: start; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 12px; display: grid; gap: 8px; }
.card h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 0; }
label { display: grid; gap: 3px; font-size: 12.5px; color: var(--muted); }
input, select, textarea { font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; }
textarea { font: 12px/1.4 ui-monospace, Consolas, monospace; min-height: 160px; resize: vertical; }
button { font: inherit; padding: 6px 12px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); cursor: pointer; }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
ol { margin: 0; padding-left: 20px; display: grid; gap: 4px; }
li { font-size: 13px; }
li .meta { color: var(--muted); font-size: 12px; }
li button { padding: 1px 7px; font-size: 12px; }
.hint { color: var(--muted); font-size: 12.5px; margin: 0; }
.err { color: var(--ignore); }
</style>
</head>
<body>
<header>
  <h1>Benchmark labeller</h1>
  <label class="row">Image <input type="file" id="file" accept="image/png,image/jpeg"></label>
  <span class="hint" id="size">Load a dashboard image to start.</span>
  <span class="row"><label class="row"><input type="radio" name="mode" value="visual" checked> Draw visuals</label>
  <label class="row"><input type="radio" name="mode" value="ignore"> Draw areas to ignore</label></span>
</header>
<main>
  <div class="stage"><canvas id="cv" width="10" height="10"></canvas></div>
  <div class="side">
    <section class="card"><h2>Dashboard</h2>
      <label>ID (short, unique) <input id="id" placeholder="powerbi-retail-analysis"></label>
      <label>Tool <select id="tool"><option>Power BI</option><option>Tableau</option><option>Looker</option><option>Qlik</option><option>Excel</option><option>SSRS</option><option>Other</option></select></label>
      <label>Source URL (the image's own address) <input id="source" placeholder="https://..."></label>
      <label>Licence or terms <input id="terms" placeholder="CC BY 4.0 / author's content, used for local evaluation only"></label>
    </section>
    <section class="card"><h2>Next box</h2>
      <label>Chart type <select id="type">
        <option value="kpi">KPI card</option><option value="column">Column (vertical bars)</option><option value="bar">Bar (horizontal bars)</option>
        <option value="line">Line</option><option value="area">Area</option><option value="combo">Combo (bars + line)</option><option value="pie">Pie</option>
        <option value="donut">Donut</option><option value="waterfall">Waterfall</option><option value="scatter">Scatter / bubble</option><option value="treemap">Treemap</option>
        <option value="map">Map</option><option value="table">Table</option><option value="pivot">Matrix (pivot)</option><option value="gauge">Gauge</option>
        <option value="funnel">Funnel</option><option value="radar">Radar</option><option value="sunburst">Sunburst</option><option value="bullet">Bullet</option>
        <option value="slicer">Slicer / filter</option><option value="text">Text block</option><option value="other">Something else</option></select></label>
      <label>Title, as shown (leave empty if it has none) <input id="title"></label>
      <p class="hint">Drag on the image from one corner of the visual's card to the other, title included. Undo with the × beside it.</p>
    </section>
    <section class="card"><h2>Boxes</h2><ol id="list"></ol></section>
    <section class="card"><h2>Entry for truth.json</h2>
      <textarea id="out" readonly></textarea>
      <div class="row"><button class="primary" id="copy" type="button">Copy entry</button><span class="hint" id="copied"></span></div>
    </section>
  </div>
</main>
<script>
(function () {
  const $ = (id) => document.getElementById(id), cv = $('cv'), ctx = cv.getContext('2d');
  let img = null, scale = 1, drag = null;
  const st = { visuals: [], ignore: [] };
  const mode = () => document.querySelector('input[name="mode"]:checked').value;

  $('file').addEventListener('change', (e) => {
    const f = e.target.files[0]; if (!f) return;
    const im = new Image();
    im.onload = () => {
      img = im; scale = Math.min(1, 1400 / im.width);
      cv.width = Math.round(im.width * scale); cv.height = Math.round(im.height * scale);
      $('size').textContent = im.width + ' × ' + im.height + ' px' + (scale < 1 ? ' (shown at ' + Math.round(scale * 100) + '%)' : '');
      if (!$('id').value) $('id').value = f.name.replace(/\.[^.]+$/, '').toLowerCase().replace(/[^a-z0-9]+/g, '-');
      st.visuals = []; st.ignore = []; draw(); render();
    };
    im.src = URL.createObjectURL(f);
  });
  const at = (e) => { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) / scale, (e.clientY - r.top) / scale]; };
  cv.addEventListener('mousedown', (e) => { if (!img) return; drag = { a: at(e), b: at(e) }; });
  cv.addEventListener('mousemove', (e) => { if (drag) { drag.b = at(e); draw(); } });
  window.addEventListener('mouseup', () => {
    if (!drag) return;
    const [x0, y0] = drag.a, [x1, y1] = drag.b, box = [Math.min(x0, x1), Math.min(y0, y1), Math.max(x0, x1), Math.max(y0, y1)].map(Math.round);
    drag = null;
    if (box[2] - box[0] < 8 || box[3] - box[1] < 8) { draw(); return; }
    if (mode() === 'ignore') st.ignore.push(box);
    else { st.visuals.push({ type: $('type').value, title: $('title').value.trim(), bbox: box }); $('title').value = ''; }
    draw(); render();
  });
  function draw() {
    if (!img) return;
    ctx.drawImage(img, 0, 0, cv.width, cv.height);
    const rect = (b, c, label) => {
      ctx.strokeStyle = c; ctx.lineWidth = 2; ctx.strokeRect(b[0] * scale, b[1] * scale, (b[2] - b[0]) * scale, (b[3] - b[1]) * scale);
      if (label) { ctx.fillStyle = c; ctx.font = '12px system-ui'; const w = ctx.measureText(label).width + 8; ctx.fillRect(b[0] * scale, b[1] * scale, w, 16); ctx.fillStyle = '#fff'; ctx.fillText(label, b[0] * scale + 4, b[1] * scale + 12); }
    };
    st.visuals.forEach((v, i) => rect(v.bbox, '#0f6e8c', (i + 1) + ' ' + v.type));
    st.ignore.forEach((b) => rect(b, '#b4531f', 'ignore'));
    if (drag) rect([...drag.a, ...drag.b].map((v, i, a) => i < 2 ? Math.min(v, a[i + 2]) : Math.max(v, a[i - 2])), '#d02670');
  }
  function render() {
    const list = $('list'); list.innerHTML = '';
    st.visuals.forEach((v, i) => {
      const li = document.createElement('li');
      li.innerHTML = '<b></b> <span class="meta"></span> <button type="button" aria-label="Remove">×</button>';
      li.querySelector('b').textContent = v.type + (v.title ? ' · ' + v.title : '');
      li.querySelector('.meta').textContent = v.bbox.join(', ');
      li.querySelector('button').onclick = () => { st.visuals.splice(i, 1); draw(); render(); };
      list.appendChild(li);
    });
    st.ignore.forEach((b, i) => {
      const li = document.createElement('li'); li.className = 'err';
      li.innerHTML = 'ignore <span class="meta"></span> <button type="button" aria-label="Remove">×</button>';
      li.querySelector('.meta').textContent = b.join(', ');
      li.querySelector('button').onclick = () => { st.ignore.splice(i, 1); draw(); render(); };
      list.appendChild(li);
    });
    const entry = { id: $('id').value.trim(), tool: $('tool').value, size: img ? [img.width, img.height] : [], source: $('source').value.trim(),
      terms: $('terms').value.trim(), ...(st.ignore.length ? { ignore: st.ignore } : {}), visuals: st.visuals };
    $('out').value = JSON.stringify(entry, null, 1);
  }
  ['id', 'tool', 'source', 'terms'].forEach((k) => $(k).addEventListener('input', render));
  $('copy').addEventListener('click', async () => {
    try { await navigator.clipboard.writeText($('out').value); $('copied').textContent = 'Copied.'; }
    catch (e) { $('out').select(); $('copied').textContent = 'Press Ctrl+C to copy.'; }
  });
  render();
})();
</script>
</body>
</html>
