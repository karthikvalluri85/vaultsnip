<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VaultSnip supported charts</title>
<style>
:root{--bg:#f3f4f6;--ink:#14181e;--muted:#5b6470;--card:#fff;--line:#d9dee4;--accent:#0b6e4f}
@media (prefers-color-scheme:dark){:root{--bg:#0f1215;--ink:#eef1f4;--muted:#a3abb5;--card:#171b20;--line:#2a3038;--accent:#5fd3a5}}
body{margin:0;padding:28px 16px;font:15px/1.55 ui-sans-serif,system-ui,sans-serif;background:var(--bg);color:var(--ink)}
main{max-width:1180px;margin:0 auto}a{color:var(--accent)}h1{font-size:24px;margin:0 0 6px}p.lead{color:var(--muted);margin:0 0 20px;max-width:75ch}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px}
.entry{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;min-width:0}
.entry h2{font-size:15px;margin:0 0 2px}.entry .data{font-size:12.5px;color:var(--muted);margin:0 0 8px}
.entry .demo{min-height:260px}
</style></head>
<body><main>
<!-- Drawn from the chart catalogue (web/catalog.js) by VaultSnip's own replica engine when the page loads: nothing here is
     written by hand, so a type added to the catalogue appears here too. The examples are invented. -->
<h1>Charts VaultSnip can rebuild</h1>
<p class="lead">Every visual type a VaultSnip replica can draw, each drawn live from an invented example by the same engine
that builds your replicas. The line under each name says what data the replica needs for it. <a href="./">Back to VaultSnip</a></p>
<div class="grid" id="grid"></div>
</main>
<script src="lib/echarts.min.js"></script>
<script src="lib/vs-faker.js"></script>
<script src="replica.js"></script>
<script src="catalog.js"></script>
<script src="charts-page.js"></script>
</body></html>
